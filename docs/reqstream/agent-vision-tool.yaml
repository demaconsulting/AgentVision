---
# AgentVisionTool System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what end-users need the tool to provide
# - These requirements capture the externally visible behavior of the complete system
# - The tool is a thin command-line front-end: camera logic belongs in the DemaConsulting.AgentVision.Core
#   library, and the library never depends on the tool
# - System requirements are validated through integration tests that exercise the
#   published dotnet DLL end-to-end

sections:
  - title: AgentVisionTool Requirements
    requirements:
      - id: AgentVisionTool-System-Version
        title: The tool shall display version information when the version flag is provided.
        tags: [system]
        justification: |
          Users need to quickly identify the version of the tool they are using for
          troubleshooting and compatibility verification. The version display must
          work from a standard dotnet invocation without additional configuration.
        children:
          - AgentVisionTool-Program-Version
          - AgentVisionTool-Cli-Version
        tests:
          - AgentVisionTool_VersionFlag_Provided_OutputsVersion

      - id: AgentVisionTool-System-Help
        title: The tool shall display usage information when the help flag is provided.
        tags: [system]
        justification: |
          Users need access to command-line usage documentation without requiring
          external resources. Help output must be accessible from a standard dotnet
          invocation and must list the available options so that users can self-serve.
        children:
          - AgentVisionTool-Program-Help
          - AgentVisionTool-Cli-Help
        tests:
          - AgentVisionTool_HelpFlag_Provided_OutputsUsageInformation

      - id: AgentVisionTool-System-HelpTopics
        title: The tool shall list its help topics when run with the `help` command.
        tags: [system]
        justification: |
          Users and AI agents that have only the installed tool must be able to learn how to
          use it from the tool itself. The short `--help` usage text points to the topic list,
          and each topic explains a task with worked examples.
        children:
          - AgentVisionTool-Program-HelpCommand
          - AgentVisionTool-Program-HelpFooter
          - AgentVisionTool-Cli-HelpTopics
        tests:
          - AgentVisionTool_HelpTopics_HelpVerb_ListsTopics

      - id: AgentVisionTool-System-HelpUnknownTopic
        title: The tool shall exit with code 2 when the `help` command names an unknown topic.
        tags: [system]
        justification: |
          Scripts and AI agents must be able to tell a mistyped topic from a successful answer,
          and from the exit code 1 of a failed tool run.
        children:
          - AgentVisionTool-Program-HelpCommand
        tests:
          - AgentVisionTool_HelpTopics_UnknownTopic_ReturnsUsageError

      - id: AgentVisionTool-System-HelpExamples
        title: The tool shall provide help examples that give the result each example states when run.
        tags: [system]
        justification: |
          A worked example in the help is only useful when it works. Running every command
          example against the built tool, and comparing the exit code and output with what
          the example states, keeps the help in step with the tool.
        children:
          - AgentVision-OTS-HelpCards-Testing
        tests:
          - AgentVisionTool_HelpExamples_AllCommandExamples_GiveStatedResults

      - id: AgentVisionTool-System-Validate
        title: The tool shall execute self-validation tests when the validate flag is provided.
        tags: [system]
        justification: |
          Regulated environments require tool qualification evidence to demonstrate
          that the tool functions correctly in its deployment environment before it
          is used to generate compliance artifacts. The validation mode exercises
          core behaviors and produces a structured test result file, providing the
          qualification evidence required by quality management systems.
        children:
          - AgentVisionTool-Program-Validate
          - AgentVisionTool-Cli-Validate
          - AgentVisionTool-SelfTest-Qualification
        tests:
          - AgentVisionTool_ValidateFlag_Provided_RunsValidation

      - id: AgentVisionTool-System-Silent
        title: The tool shall suppress console output when the silent flag is provided.
        tags: [system]
        justification: |
          Enables automated scripts and CI/CD pipelines to run the tool without
          cluttering output logs when only the exit code is needed.
        children:
          - AgentVisionTool-Cli-Silent
        tests:
          - AgentVisionTool_SilentFlag_Provided_SuppressesOutput

      - id: AgentVisionTool-System-Log
        title: The tool shall write output to a log file when the log flag is provided.
        tags: [system]
        justification: |
          Provides persistent logging for debugging and compliance audit trails.
          Log files enable post-run inspection of tool output without requiring
          console capture.
        children:
          - AgentVisionTool-Cli-Log
        tests:
          - AgentVisionTool_LogFlag_Provided_WritesOutputToFile

      - id: AgentVisionTool-System-ErrorHandling
        title: The tool shall return a non-zero exit code for unrecognized arguments.
        tags: [system]
        justification: |
          A non-zero exit code enables CI/CD pipelines to detect and
          surface misconfiguration failures automatically.
        children:
          - AgentVisionTool-Program-ExitCode
          - AgentVisionTool-Cli-ExitCode
        tests:
          - AgentVisionTool_UnknownArgument_Provided_ReturnsError

      - id: AgentVisionTool-System-ErrorMessage
        title: The tool shall report an error message for unrecognized arguments.
        tags: [system]
        justification: |
          Clear feedback for unrecognized arguments helps users quickly correct
          mistakes and prevents silent misconfiguration.
        children:
          - AgentVisionTool-Cli-InvalidArgs
          - AgentVisionTool-Cli-ErrorOutput
        tests:
          - AgentVisionTool_UnknownArgument_Provided_ReturnsError

      - id: AgentVisionTool-System-Results
        title: >-
          The tool shall write self-validation results to a standard test result
          file when the `--results` flag is provided.
        tags: [system]
        justification: |
          Enables integration with CI/CD systems that expect standard test result formats.
          TRX format is compatible with MSTest; JUnit XML is compatible with many CI tools.
        children:
          - AgentVisionTool-Cli-Results
          - AgentVisionTool-SelfTest-ResultsOutput
        tests:
          - AgentVisionTool_ValidateWithTrxResults_Requested_GeneratesTrxFile
          - AgentVisionTool_ValidateWithXmlResults_Requested_GeneratesJUnitFile

      - id: AgentVisionTool-System-Depth
        title: The tool shall adjust the heading depth of validation output when the `--depth` flag is provided.
        tags: [system]
        justification: |
          Enables validation output to be embedded within larger markdown documents at
          the appropriate heading level, supporting documentation workflows that combine
          multiple reports.
        children:
          - AgentVisionTool-Cli-Depth
        tests:
          - AgentVisionTool_ValidateFlag_Provided_RunsValidation
          - AgentVisionTool_ValidateWithDepth_DepthThree_OutputsCorrectHeadingLevel

      - id: AgentVisionTool-System-ValidateFailure
        title: The tool shall return a non-zero exit code when the results file cannot be written.
        tags: [system]
        justification: |
          A non-zero exit code on results-write failure enables CI/CD pipelines to detect
          and surface output errors automatically, preventing silent loss of validation
          evidence in compliance-critical workflows.
        children:
          - AgentVisionTool-SelfTest-InvalidExtension
        tests:
          - AgentVisionTool_ValidateWithBadExtension_ExtensionInvalid_ReturnsNonZero

      - id: AgentVisionTool-System-DefaultBehavior
        title: The tool shall display a banner then run the default tool logic when invoked without any action flags.
        tags: [system]
        justification: |
          When a user invokes the tool without any recognized action flag, the tool shall
          display a banner identifying itself and run its primary logic so that the
          invocation is never silently empty.
        children:
          - AgentVisionTool-Cli-ArgumentParsing
          - AgentVisionTool-Cli-OutputChannels
        tests:
          - AgentVisionTool_NoArguments_Invoked_DisplaysBanner

      - id: AgentVisionTool-System-ResultAlias
        title: The tool shall accept `--result` as a legacy alias for `--results`.
        tags: [system]
        justification: |
          Backward compatibility with scripts that use the earlier `--result` spelling
          prevents breakage when upgrading to newer tool versions.
        children:
          - AgentVisionTool-Cli-ResultAlias
        tests:
          - AgentVisionTool_ResultAlias_LegacyFlag_WritesResultsFile
