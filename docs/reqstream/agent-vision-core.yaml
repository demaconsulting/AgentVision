---
# AgentVisionCore System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what consumers of the DemaConsulting.AgentVision.Core
#   library package need from it
# - The library owns ALL camera logic; the tool is a thin front-end that depends on it, never the
#   reverse
# - The library is the foundation of AgentVision: low-latency webcam capture for AI agents. The first
#   camera capability is enumeration (Cameras subsystem); further capabilities are added, top-down,
#   with their own requirements, design, and verification
# - Package requirements are validated by FileAssert checks of the produced NuGet package
#   (.fileassert.yaml, run by build.yaml) and by assembly-level tests in AgentVisionCoreTests.cs

sections:
  - title: AgentVisionCore Requirements
    requirements:
      - id: AgentVisionCore-System-Package
        title: The library shall be distributed as the DemaConsulting.AgentVision.Core NuGet package.
        tags: [system]
        justification: |
          Consumers (including the AgentVision tool) obtain the library as a NuGet package. The
          package identity, its net10.0 and net11.0 assemblies, and its publisher metadata must be
          stable so that dependent projects can reference the library by a single, predictable
          name. The primary evidence is the produced package itself: the build packs the library
          and FileAssert inspects the resulting .nupkg (package id, lib/net10.0 and lib/net11.0
          assemblies and XML documentation, license, README, icon, and the companion symbols
          package). The assembly-level tests additionally confirm the compiled assembly carries
          the same identity and metadata.
        tests:
          - AgentVisionCore_Package_Packed_ContainsLibraryAssemblies
          - AgentVisionCore_Package_Packed_HasPackageMetadata
          - AgentVisionCore_Assembly_Loaded_HasPackageName
          - AgentVisionCore_Assembly_Loaded_HasPackageMetadata

      - id: AgentVisionCore-System-ToolIndependent
        title: The library shall be usable without the AgentVision tool and shall not depend on it.
        tags: [system]
        justification: |
          The library owns all camera logic so that any .NET application can use webcams without
          the command-line tool; the tool is only a thin front-end that depends on the library. A
          library that depended on the tool would invert that layering, forcing consumers to take
          the tool (and its console, argument-parsing, and exit-code concerns) with it.
        tests:
          - AgentVisionCore_Assembly_Loaded_DoesNotReferenceTool

      - id: AgentVisionCore-System-CameraEnumeration
        title: >-
          The library shall enumerate the video capture devices of the host and report, for each, its
          identifier, its name, and the video formats (resolution, pixel format, and frame rate) it supports.
        tags: [system]
        justification: |
          Every camera feature of AgentVision starts with knowing which cameras exist and what each can
          deliver, and the AI agent or application that uses the library needs that answer in plain values,
          not in the types of a capture library. A stable identifier lets later operations name one camera
          reliably, and the supported formats let a caller choose a size and frame rate that the camera
          really offers.
        children:
          - AgentVisionCore-Cameras-Enumeration
        tests:
          - AgentVisionCore_Cameras_CustomSource_Enumerated_ReportsCameras

      - id: AgentVisionCore-System-NoCameras
        title: The library shall report an empty list, and not an error, when no camera is available.
        tags: [system]
        justification: |
          Many machines, such as servers, containers, and build agents, have no camera. Callers must be able
          to treat "no camera" as an ordinary answer, so that an automated run on such a machine completes
          and can report that nothing was found.
        children:
          - AgentVisionCore-Cameras-NoCameras
        tests:
          - AgentVisionCore_Cameras_NoneAttached_ReturnsEmptyList
          - AgentVisionCore_Cameras_DefaultSource_Enumerated_DoesNotThrow

      - id: AgentVisionCore-System-InjectableSource
        title: >-
          The library shall let an application supply its own source of camera descriptions, so that
          enumeration can run without camera hardware.
        tags: [system]
        justification: |
          Applications and test suites need to exercise everything that depends on the list of cameras on
          machines that have none, and need a seam where a different capture mechanism can be plugged in
          later. A supplied source also keeps the public API free of the types of the capture library, so a
          change of that library cannot break consumers.
        children:
          - AgentVisionCore-Cameras-SourceAbstraction
        tests:
          - AgentVisionCore_Cameras_CustomSource_Enumerated_ReportsCameras
