---
# Software Unit Requirements for the HelpCommand Class
#
# The HelpCommand class answers the `agentvision help` command from the help cards that are
# embedded in the tool assembly. It is the only unit that uses the HelpCards library.

sections:
  - title: AgentVisionTool Requirements
    sections:
      - title: Cli Subsystem Requirements
        sections:
          - title: HelpCommand Unit Requirements
            requirements:
              - id: AgentVisionTool-HelpCommand-HelpVerb
                title: >-
                  The HelpCommand class shall answer the `help` verb from the help cards embedded in the
                  tool assembly.
                justification: |
                  A user or an AI agent that has only the installed tool must be able to learn it from
                  `agentvision help`. The cards travel inside the assembly, so the help works wherever
                  the tool is installed.
                children:
                  - AgentVision-OTS-HelpCards-Cli
                tests:
                  - HelpCommand_TryRun_HelpVerb_PrintsTopicIndexAndReturnsZero

              - id: AgentVisionTool-HelpCommand-ValidCards
                title: >-
                  The HelpCommand class shall serve only help cards that pass validation with the expected
                  set of topics and purpose tags.
                justification: |
                  A defective card, a missing topic, or a card without a purpose would give users wrong
                  or hard-to-find guidance. Validating the shipped catalog, with warnings treated as
                  errors, keeps the help correct before release.
                children:
                  - AgentVision-OTS-HelpCards-Testing
                tests:
                  - HelpCommand_CreateOptions_ShippedCatalog_PassesValidation

              - id: AgentVisionTool-HelpCommand-LineWidth
                title: The HelpCommand class shall print every help card in lines of at most 120 characters.
                justification: |
                  Help is read in terminals and CI logs. Expanded links and tokens make printed lines
                  longer than the card source, so the printed width is what must stay readable.
                tests:
                  - HelpCommand_TryRun_EveryCard_FitsMaximumLineWidth
